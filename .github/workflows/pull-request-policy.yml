name: Pull Request Policy

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to evaluate"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  validate-policy:
    name: Validate Contribution & WOCS Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (trusted base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run Policy Validator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: node .github/scripts/pr-policy.mjs
