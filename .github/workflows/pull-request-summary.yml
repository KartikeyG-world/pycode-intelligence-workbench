name: Pull Request Summary

on:
  workflow_run:
    workflows: ["Pull Request CI"]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-summary-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  post-summary:
    name: Post CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch (trusted)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Publish or Update CI Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ -f .github/scripts/pr-summary.mjs ]; then
            node .github/scripts/pr-summary.mjs
          else
            echo "PR summary script not present on default branch yet. Skipping."
          fi
