name: Pull Request Summary

on:
  workflow_run:
    workflows: ["Pull Request CI"]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-summary-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  post-summary:
    name: Post CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Publish or Update CI Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ -f .github/scripts/pr-summary.mjs ]; then
            node .github/scripts/pr-summary.mjs
          else
            echo "PR summary script not present on default branch yet. Skipping."
          fi
