# Alembic configuration for the backend PostgreSQL schema.
# Run Alembic commands from the backend/ directory:
#   uv run alembic upgrade head
#
# The database URL is loaded from app settings (DATABASE_URL / backend/.env)
# in alembic/env.py. Do not place credentials in this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
